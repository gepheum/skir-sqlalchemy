name: Skir SQLAlchemy JSON CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: isort . --check-only --skip .venv
      - run: black --check . --exclude "\\.venv"
      - run: flake8 . --count --ignore=E203,E704,W503 --max-line-length=127 --statistics --exclude=.venv
      - uses: jakebailey/pyright-action@v2
        with:
          pylance-version: latest-release
      - run: python -m unittest discover tests/ -p "test_*.py" -v
